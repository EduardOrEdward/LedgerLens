[project]
name = "ledgerlens"
version = "0.1.0"
description = "Financial data integration and reconciliation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "pydantic>=2.9,<3.0", "pydantic-settings>=2.5,<3.0", "sqlalchemy>=2.0,<3.0", "alembic>=1.13,<2.0", "psycopg[binary]>=3.2,<4.0"]

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.7,<1.0", "mypy>=1.11,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["modules/resorces"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
